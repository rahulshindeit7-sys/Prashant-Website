<svg width="640" height="180" viewBox="0 0 640 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Prashant S. Pawar Logo</title>
  <desc id="desc">Logo mark and wordmark for head and neck cancer treatment specialty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4F72"/>
      <stop offset="1" stop-color="#2A7FB1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ECC71"/>
      <stop offset="1" stop-color="#27AE60"/>
    </linearGradient>
  </defs>

  <g transform="translate(10,10)">
    <rect x="0" y="0" width="160" height="160" rx="34" fill="url(#bg)"/>

    <!-- Head: More natural rounded shape -->
    <path d="M81 24C65 24 52 37 52 53C52 62 56 70 62 76V98C58 103 55 111 55 120V137H107V120C107 111 104 103 100 98V76C106 70 110 62 110 53C110 37 97 24 81 24Z"
      fill="#F8FAFF" fill-opacity="0.96"/>

    <!-- Neck/Throat indicator lines -->
    <path d="M73 100C70 105 68 113 68 122" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M89 100C92 105 94 113 94 122" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

    <!-- Eye accent -->
    <circle cx="58" cy="58" r="8" fill="url(#accent)"/>
    <path d="M58 46V36" stroke="#F8FAFF" stroke-width="4" stroke-linecap="round"/>

    <!-- PP Initials -->
    <text x="81" y="68" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700" fill="#1B4F72">PP</text>
  </g>

  <g transform="translate(190,35)">
    <text x="0" y="44" font-family="Playfair Display, Georgia, serif" font-size="44" font-weight="700" fill="#1A1A2E">
      Dr. Prashant S. Pawar
    </text>
    <text x="0" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#1B4F72">
      Head and Neck Oncosurgeon
    </text>
    <rect x="0" y="98" width="410" height="6" rx="3" fill="url(#accent)"/>
  </g>
</svg>
