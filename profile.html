<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <meta name="description" content="Doctor profile" />
  <link rel="canonical" href="" id="canonical-url" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="profile">
  <header id="shared-header"></header>
  <main id="page-profile" class="section" aria-labelledby="profile-heading">
    <div class="container">
      <article class="profile-card">
        <figure class="profile-photo-wrap">
          <img id="profile-photo" loading="lazy" src="" alt="Doctor profile photo" />
        </figure>
        <div class="profile-card__body">
          <p class="section__label">Doctor Profile</p>
          <h1 id="profile-heading">Doctor Profile</h1>
          <p id="profile-summary" class="profile-summary">Loading profile details...</p>
          <section id="profile-content" class="profile-content"></section>
          <section id="profile-credentials" class="profile-credentials"></section>
        </div>
      </article>
    </div>
  </main>
  <footer id="shared-footer"></footer>
  <script src="assets/js/routes.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
