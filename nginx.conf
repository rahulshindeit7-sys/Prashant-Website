# =============================================================
# nginx.conf — Hostinger VPS · Doctor Website
# =============================================================
# SETUP INSTRUCTIONS:
#   1. Replace yourdomain.com with your actual domain
#   2. Copy to: /etc/nginx/sites-available/doctor-website
#   3. ln -s /etc/nginx/sites-available/doctor-website \
#            /etc/nginx/sites-enabled/doctor-website
#   4. certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   5. nginx -t && systemctl reload nginx
# =============================================================

# Allowed admin dashboard origin for config reads
map $http_origin $dashboard_origin {
    default "";
    "https://dashboard.yourdomain.com" $http_origin;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    root  /var/www/doctor-website;
    index index.html;

    # ---- SSL (managed by Certbot — do not edit manually) ----
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- GZIP Compression ----
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_buffers       16 8k;
    gzip_http_version  1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Cache: Static Assets (30 days) ----
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires     30d;
        add_header  Cache-Control "public, immutable, no-transform";
        access_log  off;
    }

    # ---- Config endpoint: read-only for dashboard integration ----
    location = /config/doctor-profile.json {
        limit_except GET { deny all; }
        expires     1h;
        add_header  Cache-Control "public, no-transform" always;
        add_header  Access-Control-Allow-Origin $dashboard_origin always;
        add_header  Access-Control-Allow-Methods "GET" always;
    }

    # ---- Security Headers ----
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=()"        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"  always;

    # Content Security Policy — adjust if adding new CDNs
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' https://checkout.razorpay.com https://www.googletagmanager.com 'unsafe-inline'; "
        "style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; "
        "font-src 'self' https://fonts.gstatic.com; "
        "img-src 'self' data: https:; "
        "frame-src https://www.google.com https://checkout.razorpay.com; "
        "connect-src 'self' https://www.google-analytics.com;"
        always;

    # ---- Main location ----
    location / {
        try_files $uri $uri/ /index.html;

        # No cache for HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ---- Block hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- Custom error pages ----
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # ---- Logging ----
    access_log /var/log/nginx/doctor-website.access.log;
    error_log  /var/log/nginx/doctor-website.error.log warn;
}
