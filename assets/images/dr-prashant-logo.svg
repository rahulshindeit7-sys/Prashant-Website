<svg width="640" height="180" viewBox="0 0 640 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dr Prashant Pawar Logo</title>
  <desc id="desc">Logo mark and wordmark for head and neck cancer treatment specialty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4F72"/>
      <stop offset="1" stop-color="#2A7FB1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ECC71"/>
      <stop offset="1" stop-color="#27AE60"/>
    </linearGradient>
  </defs>

  <g transform="translate(10,10)">
    <rect x="0" y="0" width="160" height="160" rx="34" fill="url(#bg)"/>

    <path d="M81 26C63 26 48 41 48 59C48 73 57 84 69 89V101C58 107 51 119 51 133V137H111V133C111 119 104 107 93 101V89C105 84 114 73 114 59C114 41 99 26 81 26Z"
      fill="#F8FAFF" fill-opacity="0.96"/>

    <path d="M81 105C73 109 69 117 69 126" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M82 105C91 109 95 117 95 126" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

    <circle cx="56" cy="62" r="8" fill="url(#accent)"/>
    <path d="M56 52V42" stroke="#F8FAFF" stroke-width="4" stroke-linecap="round"/>

    <text x="80" y="72" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700" fill="#1B4F72">PP</text>
  </g>

  <g transform="translate(190,35)">
    <text x="0" y="44" font-family="Playfair Display, Georgia, serif" font-size="44" font-weight="700" fill="#1A1A2E">
      Dr. Prashant Pawar
    </text>
    <text x="0" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#1B4F72">
      Head and Neck Cancer Treatment
    </text>
    <rect x="0" y="98" width="410" height="6" rx="3" fill="url(#accent)"/>
  </g>
