<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Prashant S. Pawar logo</title>
  <desc id="desc">Head and neck oncosurgeon logo with profile head icon, medical cross, and specialty text.</desc>
  <defs>
