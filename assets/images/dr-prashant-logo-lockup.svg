    <text x="0" y="176" fill="#00975E" font-size="52" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif">Head and Neck Oncosurgeon</text>
    <text x="0" y="246" fill="#243244" font-size="33" font-weight="400" letter-spacing="7" font-family="Inter, Segoe UI, Arial, sans-serif">Expertise  |  Precision  |  Compassion</text>
