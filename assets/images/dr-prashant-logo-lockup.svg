    <path d="M157 255C194 276 238 278 274 260" stroke="url(#greenGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M235 127C258 155 270 187 264 231" stroke="url(#greenGrad)" stroke-width="15" stroke-linecap="round"/>
    <circle cx="226" cy="116" r="19" fill="url(#greenGrad)"/>
    <circle cx="260" cy="237" r="16" fill="url(#greenGrad)"/>

    <rect x="248" y="52" width="72" height="72" rx="16" fill="url(#greenGrad)" stroke="white" stroke-width="7"/>
    <rect x="277" y="67" width="15" height="42" rx="4" fill="white"/>
